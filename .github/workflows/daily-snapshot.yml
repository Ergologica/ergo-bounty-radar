name: Daily snapshot

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC, after the upstream board regenerates at midnight UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch board, archive snapshot, refresh index.html
        run: node scripts/archive.js
        env:
          # Read-only use: lets the contention sweep query linked PRs and labels
          # on public upstream repos without hitting the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if anything changed
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: daily snapshot $(date -u +%F)"
          git push
